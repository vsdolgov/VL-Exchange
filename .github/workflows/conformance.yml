name: VL Exchange conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: model/src:scenario/src:security-runtime/src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify.py
      - name: Test VLSP and VLMP 0.2 specifications
        env:
          PYTHONPATH: drafts/v0.2/scenario/src:drafts/v0.2/model/src:drafts/v0.2/security-runtime/src
        run: python -m pytest -q -p no:cacheprovider --import-mode=importlib drafts/v0.2/scenario/tests drafts/v0.2/model/tests drafts/v0.2/videopipe-pilot/independent/tests security-runtime/tests/test_protection.py
      - name: Test unified VLMP 0.2.0 and legacy packages
        env:
          PYTHONPATH: drafts/v0.2/vlmp-unified:model/src:scenario/src:security-runtime/src:drafts/v0.2/model/src
        run: |
          python -m pytest -q -p no:cacheprovider --import-mode=importlib drafts/v0.2/vlmp-unified/tests drafts/v0.2/vlmp-unified/reference/tests drafts/v0.2/vlmp-unified/independent/tests
          python drafts/v0.2/vlmp-unified/tools/compare_hosts.py > /tmp/vlmp-unified-comparison.json
      - run: python tools/check_links.py
